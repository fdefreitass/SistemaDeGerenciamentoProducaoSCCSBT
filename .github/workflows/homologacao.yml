name: Homologação SCC Produção
# Reimplantação solicitada: manter feat/admin-usuarios como branch de produção
on:
  push:
    branches: [feat/admin-usuarios]
  pull_request:
    branches: [feat/admin-usuarios]
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
