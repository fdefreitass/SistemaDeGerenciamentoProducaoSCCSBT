name: Validar frontend

on:
  push:
    branches:
      - feat/primeiro-acesso
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript e Vite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Compilar aplicação
        run: npm run build
